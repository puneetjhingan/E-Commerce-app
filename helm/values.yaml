# Namespace for all resources
namespace: easyshop

# Replica count for your deployment/statefulset
replicaCount: 1

# Image configuration
image:
  repository: puneetjhingan/easyshop-app
  tag: "23"
  pullPolicy: IfNotPresent

# Image pull secrets for private repos
imagePullSecrets: []

# Override chart names if needed
nameOverride: ""
fullnameOverride: ""

# Service Account configuration
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod-level annotations and labels
podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

# Service configuration
service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30000

# Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: 172.18.0.2.nip.io
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: easyshop-service
              port:
                number: 3000
  tls: []

# Autoscaling (HPA)
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Resource requests and limits
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

# Probes
livenessProbe:
  httpGet:
    host: 172.18.0.2.nip.io
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

startupProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 5
  periodSeconds: 10

# Config 
config:
  NODE_ENV: "dev"
  NEXTAUTH_URL: "http://172.18.0.2.nip.io"
  NEXT_PUBLIC_API_URL: "http://172.18.0.2.nip.io/api"

# App DB config 
database:
  enabled: true
  type: mongodb
  host: easyshop-mongodb
  port: 27017

# MongoDB (Bitnami subchart)
mongodb:
  enabled: true
  auth:
    username: ""  # Injected securely with --set-file
    password: ""  # Injected securely with --set-file
    database: easyshop
  architecture: standalone
  primary:
    persistence:
      enabled: true
      size: 8Gi

# App Persistent Volume
persistence:
  enabled: true
  accessMode: ReadWriteOnce
  size: 5Gi
  storageClass: standard
  mountPath: /data

# StatefulSet config
statefulSet:
  enabled: false
  replicas: 1
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi

# Migration Job  ( Run as seperate job manually)
migrationJob:
  enabled: false
  image:
    repository: puneetjhingan/migration
    tag: "latest"
  backoffLimit: 4
