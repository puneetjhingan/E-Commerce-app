apiVersion: v1
kind: Service
metadata:
  name: easyshop-service
  namespace: easyshop
spec:
  type: NodePort
  ports:
    - port: 80 #port exposed inside the cluster
      targetPort: 3000 # port where the application is running inside the pod
      nodePort: 30000 #port exposed to access the service from outside the cluster
  selector:
    app: easyshop
